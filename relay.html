<!doctype html><meta charset="utf-8"><title>relay</title><p id="s">relay ready</p>
<script>
const bc=new BroadcastChannel('tr-aab');
const ok=o=>o==='https://github.com'||o==='https://play.google.com';
window.addEventListener('message',e=>{if(!ok(e.origin))return;bc.postMessage(e.data);document.getElementById('s').textContent='sent';});
bc.onmessage=e=>{if(window.opener){window.opener.postMessage(e.data,'https://play.google.com');document.getElementById('s').textContent='forwarded';}};
</script>
